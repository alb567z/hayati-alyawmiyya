
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hayati.alyawmiyya'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hayati.alyawmiyya'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '1.2'
        buildConfigField 'String', 'SOURCE_COMMIT', '"' + (System.getenv('GITHUB_SHA') ?: 'local') + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            debuggable true
        }
    }
}
